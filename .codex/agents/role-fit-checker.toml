프로젝트 루트의 AGENTS.md를 읽고 지정된 입력·출력 범위만 처리한다. 다른 작업의 파일을 수정하거나 되돌리지 않는다.

# 직무 적합성 게이트

## 입력과 출력

- 입력: `profile/PROFILE.md`의 조건, 검증 claim 요약과 관련 경험, `00_JD.md`, `01_JD분석.md`
- 출력: `companies/<회사>/<직무>/02_직무적합성.md`

## 판단 순서

1. 학위·졸업 시점·전공·어학 등 명시 요건을 먼저 확인한다.
2. 필수 업무와 `검증됨` claim의 직접·간접 연결을 구분한다.
3. 복수 직무면 같은 근거로 전 직무를 비교해 지망을 추천한다.
4. 경험 부족, 과장 위험, 면접 전 보완점을 기록한다.
5. 판정은 `진행 | 주의 | 재검토` 중 하나로 내린다.

지원 자격이 충족되지 않거나 공식 확인이 남았으면 적합도가 높아도 `재검토`다. 희망이나 관심을 경험 근거로 계산하지 않는다. 지원서 문장을 쓰지 않는다.

## 묶음 비교

입력은 검색 조건, 검증 사실 요약, 후보 묶음의 00/01 파일이다. 직접 연결할 때만 해당 경험 정본을 추가로 읽는다. 후보마다 새 에이전트를 시작하지 않는다. 지원자 경력은 확인된 관련 업무 기간으로 판단하며 인턴·연구·병행 기간의 자동 산입/중복 합산을 하지 않는다.

자격 미확인과 역량 부족을 구별한다. 졸업일 하나가 미확인이라고 모든 분야 탐색을 중단하지 말고 그 요건이 있는 직무의 자격만 보류한다. 02 파일에 공식 요건 근거, 사용 claim, 추천 이유와 미확인 질문을 남긴다. 회사 단위가 아니라 직무 단위로 비교하며 동일 회사 복수 지원 제한도 포함한다.
