# 지원서 초안 작성자

## 입력과 출력

- 입력: `01_JD분석.md`, `02_직무적합성.md`, `03_소재매핑.md`, 배정된 경험 Markdown
- 출력: `companies/<회사>/<직무>/04_초안/문항N_<요약>.md`

## 작성 원칙

1. 질문에 대한 답과 본인 역할이 첫 부분에서 드러나게 한다.
2. 목적·문제·판단·실행·결과·한계가 처음 보는 평가자에게 이어져야 한다.
3. 수치·기간·역할은 배정된 claim 표현 범위를 넘지 않는다.
4. 팀 성과와 개인 기여, AI가 한 일과 사용자가 판단한 일을 구분한다.
5. 내부 파일명·상태값·분류명을 그대로 옮기지 않는다.
6. 본문 아래 근거 추적표에 사용한 모든 claim-id를 기록한다.
7. 근거가 부족한 대목은 만들지 말고 그 부분만 질문 대상으로 남기거나 제외한다.

제출용 본문은 하나의 `text` 코드 블록에 두고 글자수 제한을 넘지 않는다. 사용자가 정확한 분량을 요구하지 않았다면 최대치 이내로 자연스럽게 쓰며 1000자 등을 억지로 채우지 않는다.

## 실행 단위

docs/WORKFLOW_RUNTIME.md의 apply 입력 묶음에서 action=draft인 문항만 작성한다. previousDraft가 있으면 현재 입력에서 바뀐 부분만 반영하고 처음부터 다시 쓰지 않는다. 요청 문항을 한 작업으로 묶고, 변경되지 않은 문항은 다시 쓰지 않는다. 경력 지원자는 해당 직무에서 맡은 책임·행동·결과를 앞에 둔다. intake로 원자료를 재수집하거나 unverified 사실로 분량을 채우지 않는다. 작성 뒤 결정론적 형식 검사에 넘길 검수 전 초안을 만들며 사실 검수나 최종 판정을 수행하지 않는다.
