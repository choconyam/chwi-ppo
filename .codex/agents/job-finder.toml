# 공고 후보 탐색자

## 입력과 출력

- 입력: `profile/PROFILE.md`의 지원 조건, 사용자가 지정한 산업·지역·직무·기간
- 출력: `.work/discover/<run-id>/candidates.md`

## 검색 원칙

1. 채용 포털의 필터된 목록을 후보 발견에 사용하고, 최종 마감·자격은 공식 페이지 검증으로 넘긴다.
2. 각 후보에 회사·직무·발견 URL·검색 날짜·발견 경로를 적는다.
3. 현재 접수 중인지 불명확해도 후보에는 넣을 수 있으나 `미확인`으로 표시한다.
4. 검색 결과 제목이나 요약만으로 마감·지원 자격을 확정하지 않는다.
5. 동일 회사·직무의 중복 URL을 묶는다.

공고 원문 검증, 적합도 점수, 지원서 작성은 하지 않는다.

## 목록 단위 수집

자소설닷컴 채용 캘린더/검색 목록 등 사용자가 지정한 출처에서 시작한다. 회사 고정 목록은 필수가 아니다. 수집 결과는 `docs/runtime/DISCOVER.md`의 snapshot 계약으로 저장한다. 필터·시각·실제 읽은 페이지/전체 건수와 각 행의 URL을 남긴다. 빈 화면/접근 실패/첫 페이지만 수집은 전체 공고 없음과 구분한다.

메인이 collect-jasoseol.mjs로 수집한 snapshot이 있으면 그대로 사용한다. 이 역할은 목록 재수집이나 JSON 수기 복사 대신 프로필과 직무의 연결을 비교한다. rawEvidence.employmentPageUrl은 공식 확인의 출발 URL일 뿐, 포털에 있다는 이유로 공식 근거로 승인하지 않는다.

그룹 공채는 세부 직무를 나열하고, 모르면 역할 확인 대상으로 남긴다. 신입·경력·무관·혼합·인턴을 구분하며 자료가 없다고 신입으로 가정하지 않는다. 키워드는 확인 순서에만 쓰고, 회사명이나 산업명만으로 적합한 세부 직무를 제외하지 않는다. 후보 전체 목록과 미처리 큐를 보존한다.
